name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  matrix:
    name: Release matrix smoke (0.75.0 → latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Incremental version cache: restore the newest saved .matrix-cache,
      # save an updated one under this run's key on success. Installs only
      # releases published since the last green run.
      - uses: actions/cache@v4
        with:
          path: .matrix-cache
          key: pi-matrix-${{ github.run_id }}
          restore-keys: |
            pi-matrix-
      - run: npm run test:matrix
      # Any green matrix run on main that tested a newer pi than the newest
      # existing pi-tested release tags it immediately — badge updates on
      # push, not just on the nightly cron.
      - name: Tag tested version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(cat .matrix-cache/.latest-tested)
          EXISTING=$(gh api repos/$GH_REPO/releases --jq '[.[] | select(.name | startswith("pi tested")) | .tag_name] | sort_by(.) | last // ""')
          NEWEST=$(printf '%s\n%s\n' "$EXISTING" "$VER" | sort -V | tail -1)
          if [ "$NEWEST" = "$VER" ]; then
            gh release create "$VER" --title "pi tested $VER" --notes "Release matrix green through pi $VER" || echo "tag exists"
          else
            echo "already tested through $EXISTING; matrix tested $VER"
          fi
